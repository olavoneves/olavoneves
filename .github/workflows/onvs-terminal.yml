name: ONVS Terminal

# Redesenha a capa do perfil a partir da minha atividade real no GitHub.
# 03:00 / 13:00 / 22:00 UTC = 00:00 / 10:00 / 19:00 BRT
on:
  schedule:
    - cron: "0 3,13,22 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/onvs-terminal.yml"

permissions:
  contents: write

concurrency:
  group: onvs-terminal
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar terminal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --user ${{ github.repository_owner }} --out assets/onvs-terminal.svg

      - name: Commitar se o pregão mexeu
        run: |
          if git diff --quiet -- assets/onvs-terminal.svg; then
            echo "Sem variação no painel — nada a commitar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/onvs-terminal.svg
          git commit -m "chore(onvs): fechamento do pregão $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
